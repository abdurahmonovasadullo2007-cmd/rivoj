
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivoj Lazer - Professional Lazer Xizmatlar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background-color: #f9fafb;
        }
        section {
            scroll-margin-top: 80px;
        }

        /* Maxsus Animatsiyalar */
        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(60px); 
                filter: blur(8px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
                filter: blur(0);
            }
        }

        @keyframes scanLine {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0px rgba(34, 197, 94, 0); }
            50% { box-shadow: 0 0 30px rgba(34, 197, 94, 0.2); }
        }

        .animate-reveal {
            animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .lazer-scan {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #22c55e, transparent);
            box-shadow: 0 0 15px #22c55e;
            z-index: 30;
            animation: scanLine 3s linear infinite;
        }

        .float-bg {
            animation: float 10s ease-in-out infinite;
        }

        /* Skroll qilinganda elementlar paydo bo'lishi uchun yordamchi klass */
        .reveal-on-scroll {
            opacity: 0;
            visibility: hidden;
            will-change: transform, opacity, filter;
        }
        .reveal-on-scroll.visible {
            visibility: visible;
            animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script>
        // Skroll kuzatuvchisi (Intersection Observer)
        const observerOptions = { 
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px' 
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    // Bir marta ko'ringandan so'ng observerni o'chiramiz
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // React componentlari yuklangandan keyin elementlarni kuzatishni boshlaymiz
        const scanAndObserve = () => {
            document.querySelectorAll('.reveal-on-scroll:not(.visible)').forEach(el => observer.observe(el));
        };
        
        // Dastlabki yuklanish va dinamik o'zgarishlar uchun interval
        setInterval(scanAndObserve, 500);
    </script>
</body>
</html>
